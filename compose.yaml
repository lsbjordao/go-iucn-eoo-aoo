services:
  eoo-aoo:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PROJ_NETWORK: "OFF"
      EOO_AOO_TOKEN: "${EOO_AOO_TOKEN:-}"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
